<!doctype html>
<html lang="en" class="dark scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quinton Juma | Software Engineer & Systems Architect</title>
    <meta name="description" content="Portfolio of Quinton Juma — Software Developer & Telecommunications Engineer at Zone01 Kisumu specializing in Go (Golang), Next.js, Clean Architecture, M-Pesa FinTech APIs, and real-time distributed platforms." />
    
    <!-- OpenGraph / Social Meta Tags -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Quinton Juma | Software Engineer & Systems Architect" />
    <meta property="og:description" content="Software Developer specializing in high-performance Go backends, Next.js applications, and resilient distributed systems." />
    <meta property="og:image" content="https://avatars.githubusercontent.com/u/211494205?v=4" />

    <!-- Synchronous Pre-paint Theme Script (Zero White Flash / FOUC) -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('theme');
          if (saved === 'light') {
            document.documentElement.classList.remove('dark');
            document.documentElement.classList.add('light');
          } else {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
          }
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
    <style>
      html.dark, html.dark body {
        background-color: #0C0D0E !important;
        color: #EDEDEC;
      }
      html.light, html.light body {
        background-color: #FBFBFA !important;
        color: #141413;
      }
    </style>

    <!-- Google Fonts: Inter & JetBrains Mono (Minimal Swiss Precision) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  </head>
  <body class="bg-paper dark:bg-carbon-bg text-ink dark:text-carbon-text transition-colors duration-200 antialiased selection:bg-brand-emerald selection:text-white font-sans">

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
